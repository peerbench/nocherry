# Cloud Build pipeline for nocherry npm publishing.
#
# Wired to the "nocherry-publish" trigger defined in the gcp-infra repo
# (terraform/nocherry/main.tf). Triggered on every push to main.
#
# Publishes two packages to Artifact Registry (npm):
#   - @nocherry/pb-wasm  (wasm-pack output, --target=nodejs)
#   - @nocherry/sdk      (pb-js, depends on pb-wasm at the same version)
#
# Both packages share a fresh UTC timestamp version (0.0.YYYYMMDDHHMMSS)
# so each main push produces a monotonically increasing release. pb-js
# pins @nocherry/pb-wasm to the exact same version for reproducibility.

steps:
  # 1. Compile pb-wasm crate to WebAssembly with the @nocherry scope.
  #    --scope makes wasm-pack write package.json with name
  #    "@nocherry/pb-wasm" directly, no post-processing needed.
  - name: 'rust:1-slim'
    id: 'wasm-build'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        apt-get update -qq && apt-get install -y -qq curl >/dev/null
        curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh >/dev/null
        wasm-pack build packages/pb-wasm \
          --target nodejs \
          --out-dir ../../pkg \
          --scope nocherry

  # 2. Auth to AR npm, bump both package versions to a shared timestamp,
  #    install workspace deps, build pb-js with tsup, publish both.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    id: 'publish'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        apk add --no-cache nodejs npm >/dev/null

        TOKEN="$$(gcloud auth print-access-token)"
        REG="${_REGION}-npm.pkg.dev/${PROJECT_ID}/${_NPM_REPO}"
        cat > "$$HOME/.npmrc" <<EOF
        @nocherry:registry=https://$$REG/
        //$$REG/:always-auth=true
        //$$REG/:_authToken=$$TOKEN
        EOF

        # Install workspace deps + build pb-js BEFORE bumping versions.
        # While pb-js's dep is still "*", workspace name-match links
        # node_modules/@nocherry/pb-wasm -> ../pkg, so tsup picks up
        # the freshly built wasm. --ignore-scripts skips pb-node's
        # better-sqlite3 native rebuild (no toolchain in this image,
        # and we never run pb-node from here).
        #
        # Bumping pb-js's dep to a concrete version BEFORE install
        # would push npm 11 into resolving from the registry instead
        # of the local workspace, then 404 because the version isn't
        # published yet.
        npm install --ignore-scripts
        npm run build -w @nocherry/sdk

        VER="0.0.$$(date -u +%Y%m%d%H%M%S)"

        # Bump wasm package to VER and publish.
        ( cd pkg \
          && npm version "$$VER" --no-git-tag-version \
          && npm publish --registry="https://$$REG/" )

        # Pin pb-js's @nocherry/pb-wasm dep to the exact VER we just
        # published (replaces the "*" workspace marker), bump pb-js
        # itself to VER, and publish. The dist is already built
        # against the freshly compiled pkg from the workspace link
        # above, so we don't need to reinstall.
        ( cd packages/pb-js \
          && npm pkg set "dependencies.@nocherry/pb-wasm=$$VER" \
          && npm version "$$VER" --no-git-tag-version \
          && npm publish --registry="https://$$REG/" )

substitutions:
  _REGION: europe-west3
  _NPM_REPO: pbfed-npm

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
