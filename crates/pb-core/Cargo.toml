[package]
name = "pb-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "commit-reveal core: hashing, signing, selection, verification"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
drand-verify = { version = "0.6", optional = true }

[features]
default = ["drand-bls"]
# BLS verification of drand beacon outputs. Offline verifiers need it; servers do not.
drand-bls = ["dep:drand-verify"]

[dev-dependencies]
