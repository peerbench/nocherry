[package]
name = "pb-core"
version = "0.1.0"
edition = "2021"
description = "PeerBench commit-reveal core: hashing, signing, selection, verification"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
