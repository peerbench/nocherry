name = "reveal-r2"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "reveal-data"

[[d1_databases]]
binding = "DB"
database_name = "commit-reveal-db"
database_id = "ad020215-1a37-46d7-8bdd-22f7e334a9d4"

[vars]
MAX_UPLOAD_MB = "50"
RATE_LIMIT_PER_HOUR = "20"
TURNSTILE_SITE_KEY = ""
TURNSTILE_SECRET_KEY = ""
GOOGLE_OAUTH_CLIENT_ID = ""
GOOGLE_OAUTH_CLIENT_SECRET = ""
GOOGLE_OAUTH_REDIRECT_URI = ""
ANON_RATE_LIMIT_PER_HOUR = "50"

[triggers]
crons = ["0 3 * * 1"]
