name = "reveal-r2"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "reveal-data"

[[d1_databases]]
binding = "DB"
database_name = "commit-reveal-db"
database_id = "ad020215-1a37-46d7-8bdd-22f7e334a9d4"

[vars]
MAX_UPLOAD_MB = "50"
RATE_LIMIT_PER_HOUR = "20"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
GOOGLE_OAUTH_CLIENT_ID = "323104702830-khlg67viemefa9fivtu2s97t9oabco23.apps.googleusercontent.com"
GOOGLE_OAUTH_CLIENT_SECRET = "REDACTED_GOOGLE_OAUTH_CLIENT_SECRET"
GOOGLE_OAUTH_REDIRECT_URI = "https://reveal-r2.orgtopus.workers.dev/auth/callback"
ANON_RATE_LIMIT_PER_HOUR = "50"

[triggers]
crons = ["0 3 * * 1"]
