[package]
name = "pb-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pb-core = { path = "../../crates/pb-core" }
wasm-bindgen = "0.2"
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
hex = "0.4"
ed25519-dalek = "2"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
