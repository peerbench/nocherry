[package]
name = "pb-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pb-core = { path = "../../crates/pb-core", default-features = false }
wasm-bindgen = "0.2"
serde = "1"
serde-wasm-bindgen = "0.6"
serde_json = "1"
hex = "0.4"
ed25519-dalek = "2"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"

[features]
default = ["drand-bls"]
# Build with --no-default-features for server targets that never verify beacons.
drand-bls = ["pb-core/drand-bls"]
